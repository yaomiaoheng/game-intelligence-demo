name: Update public Apple Games charts
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-snapshots
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch public Apple Games charts and retain last success on partial failure
        run: python scripts/update_apple_charts.py apple-game-charts.json
      - name: Publish only a changed sanitized snapshot
        run: |
          if git diff --quiet -- apple-game-charts.json; then exit 0; fi
          git config user.name 'gamepulse-snapshot-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apple-game-charts.json
          git commit -m 'Refresh public Apple Games chart snapshot'
          git push
